<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>nouPix · Log in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Cpath d=%22M0.5,8 L8,0.5 L63.5,0.5 L63.5,56 L56,63.5 L0.5,63.5 Z%22 fill=%22%23000000%22 stroke=%22%232C2C2C%22 stroke-width=%221.6%22/%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2225%22 fill=%22none%22 stroke=%22%23F0F0F0%22 stroke-width=%224.2%22/%3E%3Cpath d=%22M2,32 H21 M39,32 H62 M21,21 L39,32 L21,43 Z M39,21 V43%22 fill=%22none%22 stroke=%22%23F0F0F0%22 stroke-width=%224.2%22 stroke-linejoin=%22miter%22/%3E%3Cpath d=%22M28.03,20.02 L29.01,18.17 M34.87,24.2 L35.85,22.35%22 fill=%22none%22 stroke=%22%23FF3B3B%22 stroke-width=%224.2%22/%3E%3Cpath d=%22M32.96,10.75 L32.35,19.94 L25.67,16.39 Z M39.8,14.93 L39.19,24.12 L32.51,20.57 Z%22 fill=%22%23FF3B3B%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/remote.css">
</head>
<body>
<main class="login">
  <div class="lcard">
    <div class="logo"><svg class="brand-icon" width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><path d="M0.5,8 L8,0.5 L63.5,0.5 L63.5,56 L56,63.5 L0.5,63.5 Z" style="fill:var(--bg0);stroke:var(--line2)" stroke-width="1.6"/><circle cx="32" cy="32" r="25" fill="none" stroke="currentColor" stroke-width="2.58"/><path d="M2,32 H21 M39,32 H62 M21,21 L39,32 L21,43 Z M39,21 V43" fill="none" stroke="currentColor" stroke-width="2.58" stroke-linejoin="miter"/><path d="M28.32,21.15 L30.83,16.44 M33.72,24.45 L36.23,19.74" fill="none" style="stroke:var(--accent)" stroke-width="2.58"/><path d="M33.25,11.88 L32.88,17.53 L28.78,15.35 Z M38.65,15.18 L38.28,20.83 L34.18,18.65 Z" style="fill:var(--accent)"/></svg><span class="lword"><svg class="brand-word" viewBox="-1.8 7.2 78.6 18.6" width="63.4" height="15" role="img" aria-label="nouPix"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="miter" d="M0,24 L0,16 L2.5,13.5 L11.5,13.5 L11.5,24 M15,16 L17.5,13.5 L26.5,13.5 L26.5,21.5 L24,24 L15,24 Z M30,13.5 L30,24 L39,24 L41.5,21.5 L41.5,13.5 M45,24 L45,11.5 L47.5,9 L56.5,9 L56.5,15.5 L54,18 L45,18 M60,13.5 L60,24"/><rect x="58.85" y="9.2" width="2.3" height="2.3" rx="0.92" style="fill:var(--accent)"/><g fill="currentColor"><rect x="62.35" y="12.35" width="2.3" height="2.3" rx="0.92"/><rect x="65.225" y="14.975" width="2.3" height="2.3" rx="0.92"/><rect x="68.1" y="17.6" width="2.3" height="2.3" rx="0.92"/><rect x="70.975" y="20.225" width="2.3" height="2.3" rx="0.92"/><rect x="73.85" y="22.85" width="2.3" height="2.3" rx="0.92"/><rect x="73.85" y="12.35" width="2.3" height="2.3" rx="0.92"/><rect x="70.975" y="14.975" width="2.3" height="2.3" rx="0.92"/><rect x="65.225" y="20.225" width="2.3" height="2.3" rx="0.92"/><rect x="62.35" y="22.85" width="2.3" height="2.3" rx="0.92"/></g></svg><small id="ver"></small></span></div>
    <h1>Who are you?</h1>
    <p class="sub">Remote control of the nouPix running on this network.</p>
    <div class="roles" role="radiogroup" aria-label="Who are you?">
      <button class="role" type="button" data-role="programmer" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <b>Programmer</b><span>Everything: fixtures, patch, zones, content. Needs the password.</span></button>
      <button class="role" type="button" data-role="operator" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18h16M7 14l3-4 3 3 4-6"/><circle cx="7" cy="14" r="1.2"/><circle cx="17" cy="7" r="1.2"/></svg>
        <b>Operator</b><span>Content, layers, scenes and zone levels. The mapping is locked.</span></button>
      <button class="role" type="button" data-role="remote" role="radio" aria-checked="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
        <b>Remote</b><span>For phones: play the scenes of each zone and dim the zones.</span></button>
    </div>
    <form class="pwbox" id="pwbox" hidden autocomplete="on">
      <input type="text" name="username" value="programmer" autocomplete="username" hidden>
      <input type="password" id="pw" name="password" placeholder="Programmer password" autocomplete="current-password" aria-label="Programmer password">
    </form>
    <button class="go" id="go" type="button" disabled>Continue</button>
    <p class="msg" id="msg" role="status"></p>
  </div>
</main>
<script src="js/login.js"></script>
</body>
</html>
